name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - run: go test -race ./... && go vet ./...
      - name: Build archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for platform in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            os=${platform%/*}
            arch=${platform#*/}
            package="rulesend_${GITHUB_REF_NAME}_${os}_${arch}"
            mkdir -p "dist/$package"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -o "dist/$package/rulesend" ./cmd/rulesend
            cp LICENSE README.md THIRD_PARTY_NOTICES.md "dist/$package/"
            cp -R licenses "dist/$package/"
            tar -C dist -czf "dist/$package.tar.gz" "$package"
          done
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --verify-tag --prerelease --generate-notes
